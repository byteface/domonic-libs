[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "domonic-libs"
dynamic = ["version"]   # single source of truth: the repo-root VERSION file
description = "DOM-focused Python ports and an optional pywebview app wrapper built on domonic"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
authors = [
    { name = "byteface", email = "byteface@googlemail.com" },
]
requires-python = ">=3.10"
dependencies = [
    # 1.5.0: off-DOM getBBox / getComputedTextLength + the d3-shape / d3-scale
    # ports the Mermaid renderers need.
    # 1.6.0: UTF-16 String semantics, static String.fromCharCode, numeric
    # charCodeAt-past-end, [^] regex translation -- the acorn tokenizer port.
    # 1.7.0: String/Number are real str/float subclasses (the interpreter's
    # own String()/Number() now delegate to them instead of an independent
    # implementation -- broken on an older domonic, where they're a
    # disconnected wrapper object instead), JSON.stringify integral-float/
    # NaN/Infinity normalisation, textContent ToString coercion, uppercase
    # tagName/nodeName, html.parser implied <tbody>/<thead>.
    "domonic>=1.7.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Text Processing :: Markup :: HTML",
]

[project.scripts]
dlx = "domonic_libs.cli:main"
domonic-libs = "domonic_libs.cli:main"
# `myjs` ships as its own distribution (packaging/myjs/) -- `pip install myjs`.

[project.urls]
Homepage = "https://github.com/byteface/domonic-libs"
Source = "https://github.com/byteface/domonic-libs"
Tracker = "https://github.com/byteface/domonic-libs/issues"
Examples = "https://github.com/byteface/domonic-libs/tree/master/examples"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pywebview>=5.0",
]
app = [
    "pywebview>=5.0",
]
examples = [
    "pywebview>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# packaging/myjs/src is a symlink to ../../src; keep collection out of it
norecursedirs = ["packaging", "build", "dist", "*.egg-info", ".venv"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["domonic_libs*"]   # `myjs` is packaged separately (packaging/myjs/)

[tool.setuptools.package-data]
domonic_libs = ["py.typed"]
"domonic_libs.conformance" = ["suite/*.js"]
"domonic_libs.js262" = ["suite/*.js"]
"domonic_libs.pyjs" = ["runtime.js"]
