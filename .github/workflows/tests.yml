name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies (pywebview / GTK)
        # The test suite never starts a real window, so a missing GTK backend
        # is not fatal -- pywebview only needs to import.
        run: |
          sudo apt-get update || true
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.0 || true
      - name: Install package
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -e ./packaging/myjs   # standalone myjs, for tests/test_myjs.py
      - name: Run tests
        run: python -m pytest
