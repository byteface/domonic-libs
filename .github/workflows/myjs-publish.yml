name: Publish myjs

# Builds the standalone `myjs` distribution and publishes it to PyPI.
# Version comes from the repo-root VERSION file (symlinked at packaging/myjs/VERSION).
#
#   make bump V=0.0.3   # optional
#   git tag myjs-v0.0.3 && git push --tags
#
# Uses PyPI Trusted Publishing (OIDC) -- configure a pending publisher for the
# `myjs` project at https://pypi.org/manage/account/publishing/ with:
#   owner: byteface   repo: domonic-libs   workflow: myjs-publish.yml
#   environment: pypi
# `workflow_dispatch` builds + checks + uploads the artifact without publishing.

on:
  push:
    tags: ["myjs-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install build twine
      - name: Build sdist + wheel
        run: python -m build packaging/myjs   # packaging/myjs/src -> ../../src
      - name: Check metadata
        run: python -m twine check packaging/myjs/dist/*
      - name: Verify the wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          whl = glob.glob("packaging/myjs/dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          need = ["myjs/__init__.py", "myjs/cli.py", "myjs/ffi.py", "myjs/host.py",
                  "myjs/_engine.py", "myjs/repl.py"]
          missing = [n for n in need if n not in names]
          if missing:
              sys.exit(f"wheel is missing: {missing}")
          entry = next(n for n in names if n.endswith("entry_points.txt"))
          assert b"myjs" in zipfile.ZipFile(whl).read(entry), "missing console script"
          print("wheel OK:", whl.split('/')[-1])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: myjs-dist
          path: packaging/myjs/dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/myjs-v')
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write   # PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: myjs-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
