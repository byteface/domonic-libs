name: Publish htmlparser2

# Builds the standalone `htmlparser2` distribution and publishes it to
# PyPI. Version comes from the repo-root VERSION file.
#
#   git tag htmlparser2-v0.0.4 && git push --tags
#
# Uses PyPI Trusted Publishing (OIDC) -- configure a pending publisher for the
# `htmlparser2` project with:
#   owner: byteface   repo: domonic-libs   workflow: htmlparser2-publish.yml
#   environment: pypi

on:
  push:
    tags: ["htmlparser2-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install build twine
      - name: Build sdist + wheel
        run: python -m build packaging/htmlparser2
      - name: Check metadata
        run: python -m twine check packaging/htmlparser2/dist/*
      - name: Verify the wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          whl = glob.glob("packaging/htmlparser2/dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          need = [
              "htmlparser2/__init__.py",
              "htmlparser2/parser.py",
              "htmlparser2/tokenizer.py",
              "htmlparser2/domhandler.py",
              "htmlparser2/domutils.py",
              "htmlparser2/domonic_adapter.py",
          ]
          missing = [n for n in need if n not in names]
          if missing:
              sys.exit(f"wheel is missing: {missing}")
          entry = next(n for n in names if n.endswith("entry_points.txt"))
          assert b"htmlparser2" in zipfile.ZipFile(whl).read(entry), "missing console script"
          print("wheel OK:", whl.split("/")[-1])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: htmlparser2-dist
          path: packaging/htmlparser2/dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/htmlparser2-v')
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: htmlparser2-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
